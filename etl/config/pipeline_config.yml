s3:
  bucket_name: "alpargatas-insights-datalake"
  raw_folder: "raw"
  intermediate_folder: "intermediate"
  processed_folder: "processed"

ingestion_sources:
  censo_escolar:
    url: "https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2023.zip"
    output_filename: "censo_2023.zip"
    target_filename_in_zip: "microdados_ed_basica_2023.csv"
  ideb:
    url: "https://download.inep.gov.br/ideb/resultados/divulgacao_anos_iniciais_municipios_2023.zip"
    output_filename: "divulgacao_anos_iniciais_municipios_2023.zip"
    target_filename_in_zip: "divulgacao_anos_iniciais_municipios_2023.xlsx"
  dtb_ibge:
    url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2024/DTB_2024.zip"
    output_filename: "DTB_2024.zip"
    target_filename_in_zip: "RELATORIO_DTB_BRASIL_2024_MUNICIPIOS.xls"


paths:
  raw_municipios_brasileiros: "raw/municipios_brasileiros.csv"
  raw_malha_setorial: "raw/malha_setorial/PB_setores_CD2022.shp"

  domicilio_renda:
    url: "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2010/Resultados_do_Universo/Agregados_por_Setores_Censitarios/PB_20231030.zip"
    output_filename: "PB_20231030.zip"
    target_filename_in_zip: "DomicilioRenda_PB.XLS"
  domicilio_infra:
    url: "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2010/Resultados_do_Universo/Agregados_por_Setores_Censitarios/PB_20231030.zip"
    output_filename: "PB_20231030.zip"
    target_filename_in_zip: "Domicilio01_PB.XLS"
  

  intermediate_escolas_paraiba: "intermediate/escolas_paraiba.parquet"
  intermediate_malha_setorial: "intermediate/censo_renda_por_setor_censitario.parquet"

  processed_escolas: "processed/escolas_processado.parquet"
  processed_professor_final: "processed/ENTREGAVEL_escolas_enriquecidas.parquet"
  processed_escolas_setorial: "processed/escolas_setorial.parquet"
  processed_ml_scores: "processed/escolas_com_score_contextualizado.parquet"
  processed_escolas_enriquecidas: "processed/ENTREGAVEL_escolas_super_enriquecidas.parquet"

# --- 2. Configurações do Banco de Dados ---
database:
  db_name: "alpargatas_insight_db"
  escolas_collection_name: "escolas"
  escolas_enrich_collection_name: "enrich_schools"
  # NOTA: A URI de conexão (com usuário/senha) continuará segura no arquivo .env

# --- 3. Configurações do Pipeline de Escolas (Principal) ---
escolas_pipeline:
  extract:
    # Parâmetros para filtrar o censo escolar
    filtro_uf: "PB"
    filtro_dependencia_adm: [1, 2, 3] # Federal, Estadual, Municipal
    filtro_situacao_funcionamento: 1 # Em atividade
    # Parâmetros para leitura do CSV
    csv_delimiter: ";"
    csv_encoding: "latin-1"

  transform:
    # Mapeamento de colunas do Censo para nomes padronizados
    column_map:
      CO_ENTIDADE: "escola_id_inep"
      NO_ENTIDADE: "escola_nome"
      CO_MUNICIPIO: "municipio_id_ibge"
      NO_MUNICIPIO: "municipio_nome"
      SG_UF: "estado_sigla"
      TP_DEPENDENCIA: "dependencia_adm"
      TP_LOCALIZACAO: "tipo_localizacao"
      QT_MAT_BAS: "total_alunos"
      IN_BIBLIOTECA: "possui_biblioteca"
      IN_INTERNET: "possui_internet"
      IN_AGUA_POTAVEL: "possui_agua_potavel"
      IN_ESGOTO_REDE_PUBLICA: "possui_saneamento_basico"
      IN_ENERGIA_REDE_PUBLICA: "possui_energia_publica"
      IN_QUADRA_ESPORTES: "possui_quadra_esportes"
      IN_ACESSIBILIDADE_INEXISTENTE: "acessibilidade_inexistente"
      IN_LABORATORIO_CIENCIAS: "possui_laboratorio_ciencias"
      IN_LABORATORIO_INFORMATICA: "possui_laboratorio_informatica"
      IN_INTERNET_ALUNOS: "possui_internet_para_alunos"
      IN_BANDA_LARGA: "possui_banda_larga"
      QT_PROF_ADMINISTRATIVOS: "total_prof_administrativos"
      QT_PROF_SERVICOS_GERAIS: "total_prof_servicos_gerais"
      QT_DESKTOP_ALUNO: "total_computadores_aluno"
      QT_DOC_BAS: "total_docentes"
      QT_TUR_BAS: "total_turmas"

    # Mapeamento para valores categóricos
    categorical_maps:
      dependencia_adm:
        1: "Federal"
        2: "Estadual"
        3: "Municipal"
        4: "Privada"
      tipo_localizacao:
        1: "Urbana"
        2: "Rural"

    # Pesos para o cálculo do Score de Risco de Infraestrutura
    risk_score_weights:
      saneamento_basico: 25
      agua_potavel: 20
      biblioteca: 20
      internet: 15
      quadra_esportes: 10
      acessibilidade_pcd: 10
      pontuacao_maxima: 100